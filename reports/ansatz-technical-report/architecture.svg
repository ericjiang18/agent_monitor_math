<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">Ansatz architecture and evidence flow</title>
  <desc id="description">A researcher or project supplies a problem to the console and job manager, which launches engine adapters and stores run artifacts. Engine outputs also enter persistent artifacts. Optional Lean checks and proof tools consume artifacts and return analysis. Inspection and sharing read persistent artifacts. Dashed arrows identify optional analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#203345"/>
    </marker>
    <style>
      .box { fill: #f6f9fa; stroke: #759faa; stroke-width: 1.4; }
      .flow { fill: none; stroke: #203345; stroke-width: 1.8; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 7 5; }
      .heading { font: 600 18px "Helvetica Neue", Arial, sans-serif; fill: #203345; }
      .detail { font: 15px "Helvetica Neue", Arial, sans-serif; fill: #203345; }
    </style>
  </defs>
  <rect width="1120" height="350" fill="#ffffff"/>
  <g aria-hidden="true">
    <path class="flow" d="M 320 80 H 420"/>
    <path class="flow" d="M 700 80 H 800"/>
    <path class="flow" d="M 560 120 V 230"/>
    <path class="flow" d="M 940 120 V 160 H 700 V 230"/>
    <path class="flow optional" d="M 420 270 H 320"/>
    <path class="flow optional" d="M 180 230 V 185 H 420 V 230"/>
    <path class="flow" d="M 700 270 H 800"/>
  </g>
  <g text-anchor="middle">
    <g>
      <rect class="box" x="40" y="40" width="280" height="80" rx="4"/>
      <text class="heading" x="180" y="73">Researcher / project</text>
      <text class="detail" x="180" y="98">Problem and task</text>
    </g>
    <g>
      <rect class="box" x="420" y="40" width="280" height="80" rx="4"/>
      <text class="heading" x="560" y="73">Console and job manager</text>
      <text class="detail" x="560" y="98">Context, owner, workspace</text>
    </g>
    <g>
      <rect class="box" x="800" y="40" width="280" height="80" rx="4"/>
      <text class="heading" x="940" y="73">Engine adapters</text>
      <text class="detail" x="940" y="98">Model and tool execution</text>
    </g>
    <g>
      <rect class="box" x="40" y="230" width="280" height="80" rx="4"/>
      <text class="heading" x="180" y="263">Optional analysis</text>
      <text class="detail" x="180" y="288">Lean checks / proof tools</text>
    </g>
    <g>
      <rect class="box" x="420" y="230" width="280" height="80" rx="4"/>
      <text class="heading" x="560" y="263">Persistent run artifacts</text>
      <text class="detail" x="560" y="288">Proofs, traces, check records</text>
    </g>
    <g>
      <rect class="box" x="800" y="230" width="280" height="80" rx="4"/>
      <text class="heading" x="940" y="263">Inspection and sharing</text>
      <text class="detail" x="940" y="288">Pipeline, graphs, snapshots</text>
    </g>
  </g>
</svg>
