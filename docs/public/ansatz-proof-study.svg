<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none">
  <title>From Ansätze to a proof</title>
  <desc>A notebook study of an initial approach branching into two lemmas, an open question, and a proof ready for review.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#d9ddce" stroke-width=".6"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 4 2.5L1 6" stroke="#56735c" stroke-width="1.2"/></marker>
  </defs>
  <rect x="20" y="20" width="520" height="520" rx="4" fill="#f4f2e8" stroke="#a7b49e"/>
  <rect x="21" y="21" width="518" height="518" rx="4" fill="url(#grid)"/>
  <path d="M57 80H504M57 482H504" stroke="#a7b49e"/>
  <g fill="#526a54" font-family="monospace" font-size="11" letter-spacing="2"><text x="57" y="58">RESEARCH NOTES</text><text x="436" y="58">No. 01</text></g>
  <text x="59" y="123" fill="#233a2b" font-family="Georgia,serif" font-size="25" font-style="italic">Suppose there is a way.</text>
  <g stroke="#56735c" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M278 209C278 237 170 224 170 262"/>
    <path d="M278 209C278 237 385 224 385 262"/>
    <path d="M170 313C170 366 278 331 278 387"/>
    <path d="M385 313C385 366 278 331 278 387"/>
    <path d="M439 290H478V373" stroke-dasharray="4 5"/>
  </g>
  <rect x="181" y="151" width="194" height="58" rx="3" fill="#e1e9d8" stroke="#56735c"/>
  <text x="278" y="187" text-anchor="middle" fill="#233a2b" font-family="Georgia,serif" font-size="27" font-style="italic">The Ansätze</text>
  <rect x="99" y="263" width="142" height="50" rx="3" fill="#f9f7ef" stroke="#91a58b"/>
  <rect x="314" y="263" width="142" height="50" rx="3" fill="#f9f7ef" stroke="#91a58b"/>
  <g text-anchor="middle" fill="#233a2b" font-family="Georgia,serif" font-size="22"><text x="170" y="295">Lemma I</text><text x="385" y="295">Lemma II</text></g>
  <text x="113" y="246" fill="#687962" font-family="Georgia,serif" font-size="15" font-style="italic">explore</text>
  <text x="351" y="246" fill="#687962" font-family="Georgia,serif" font-size="15" font-style="italic">test</text>
  <circle cx="478" cy="390" r="16" stroke="#9b8058" stroke-dasharray="3 3"/>
  <text x="478" y="396" text-anchor="middle" fill="#876d47" font-family="Georgia,serif" font-size="20">?</text>
  <text x="478" y="426" text-anchor="middle" fill="#876d47" font-family="monospace" font-size="10">open</text>
  <rect x="177" y="388" width="202" height="58" rx="3" fill="#294f39"/>
  <text x="278" y="414" text-anchor="middle" fill="#f4f2e8" font-family="Georgia,serif" font-size="22">A proof to examine</text>
  <text x="278" y="434" text-anchor="middle" fill="#cbdbc4" font-family="monospace" font-size="10" letter-spacing="1">TRACE · VERIFY · REFINE</text>
  <text x="57" y="510" fill="#526a54" font-family="Georgia,serif" font-size="14" font-style="italic">An idea is a beginning. Evidence carries it forward.</text>
