<!DOCTYPE html>
<!-- Authentication, registration, and password-reset UI for the Proving Console. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in · Proving Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
:root, [data-theme="dark"] {
  --bg: #070a10; --bg2: #0c1118; --panel: #111821ee; --panel2: #161e28;
  --border: #243044; --border2: #33465e; --fg: #eef3fb; --muted: #93a4bb; --dim: #62748c;
  --accent: #5b93ff; --accent-2: #2de0f0; --grad: linear-gradient(120deg, #5b93ff, #2de0f0 55%, #7c5cff);
  --ok: #34d399; --err: #f87171;
  --shadow: 0 18px 50px rgba(0,0,0,.38); --r: 16px;
  --ease: cubic-bezier(.22,1,.36,1);
}
[data-theme="light"] {
  --bg: #f7f8fb; --bg2: #fff; --panel: #fff; --panel2: #f3f5f9;
  --border: #dde3ed; --border2: #c8d2e0; --fg: #111827; --muted: #4b5563; --dim: #9ca3af;
  --accent: #2563eb; --accent-2: #0891b2; --grad: linear-gradient(120deg, #2563eb, #0891b2);
  --shadow: 0 8px 28px rgba(15,23,42,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(900px 420px at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%), var(--bg);
  color: var(--fg); display: flex; align-items: center; justify-content: center; padding: 24px;
}
body::before {
  content: ""; position: fixed; inset: -20%;
  background:
    radial-gradient(40% 34% at 20% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    radial-gradient(36% 30% at 82% 8%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 68%);
  animation: aurora 18s var(--ease) infinite alternate;
  pointer-events: none; z-index: 0;
}
@keyframes aurora { from { transform: translate3d(-2%,-1%,0) scale(1);} to { transform: translate3d(2%,2%,0) scale(1.05);} }
.card {
  width: min(400px, 100%); background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 30px 28px 26px;
  position: relative; z-index: 1; backdrop-filter: blur(18px);
  animation: rise .55s var(--ease) both;
}
@keyframes rise { from { opacity:0; transform: translateY(18px) scale(.98);} to { opacity:1; transform:none;} }
.brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 10px; background: var(--grad);
  display: grid; place-items: center; font-size: 16px; color: #fff; font-weight: 800;
}
.brand .nm { font-size: 17px; font-weight: 700; }
.brand .nm i { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { text-align: center; color: var(--dim); font-size: 12px; margin-bottom: 22px; }
.tabs { display: flex; padding: 3px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); margin-bottom: 18px; }
.tabs button {
  flex: 1; border: 0; background: transparent; color: var(--dim); padding: 8px 0;
  border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .22s var(--ease);
}
.tabs button.active { background: var(--panel); color: var(--fg); box-shadow: 0 1px 8px rgba(0,0,0,.1); }
form { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--dim); font-weight: 600; }
input {
  padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--panel2); color: var(--fg); font-size: 14px; outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
button.primary {
  margin-top: 4px; background: var(--grad); color: #fff; border: 0; border-radius: 10px;
  padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease);
}
button.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 30%, transparent); }
button.primary:disabled { opacity: .5; }
.err {
  display: none; color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--err) 25%, transparent); border-radius: 10px;
  padding: 9px 12px; font-size: 12px;
}
.msg {
  display: none; color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent); border-radius: 10px;
  padding: 9px 12px; font-size: 12px;
}
.divider { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 11px; margin: 16px 0 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
#google-box { display: none; justify-content: center; }
.note { margin-top: 18px; text-align: center; color: var(--dim); font-size: 11px; line-height: 1.6; }
.forgot-link { margin-top: 10px; text-align: center; }
.forgot-link a { color: var(--muted); font-size: 12px; text-decoration: none; transition: color .2s ease; }
.forgot-link a:hover { color: var(--fg); text-decoration: underline; }
.home-link {
  display: inline-flex; align-items: center; min-height: 44px; margin: -6px 0 8px;
  color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none;
  transition: color .2s ease, transform .2s var(--ease);
}
.home-link:hover { color: var(--fg); transform: translateX(-2px); }
.home-link:focus-visible { color: var(--fg); outline: 2px solid var(--accent); outline-offset: 4px; }
</style>
</head>
<body>
<div class="card">
  <a class="home-link" href="/" aria-label="Back to the Moonshot homepage">← Moonshot home</a>
  <div class="brand"><div class="logo">∎</div><div class="nm">Proving<i>Console</i></div></div>
  <div class="sub" id="sub-title">Sign in to use your own API keys and keep your runs private</div>
  <div class="tabs" id="tabs">
    <button id="tab-login" class="active">Sign in</button>
    <button id="tab-register">Create account</button>
  </div>
  <form id="form">
    <label id="name-row" style="display:none">Name (optional)<input id="name" type="text" autocomplete="nickname" placeholder="Your name"/></label>
    <label id="email-row">Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"/></label>
    <label id="password-row">Password<input id="password" type="password" autocomplete="current-password" required placeholder="At least 8 characters"/></label>
    <label id="new-password-row" style="display:none">New Password<input id="new-password" type="password" autocomplete="new-password" placeholder="At least 8 characters"/></label>
    <label id="confirm-password-row" style="display:none">Confirm New Password<input id="confirm-password" type="password" autocomplete="new-password" placeholder="Re-enter your new password"/></label>
    <div class="err" id="err"></div>
    <div class="msg" id="msg"></div>
    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>
  <div class="forgot-link" id="forgot-link"><a href="#" id="link-forgot">Forgot password?</a></div>
  <div class="divider" id="google-divider" style="display:none">or</div>
  <div id="google-box"></div>
  <div class="note">Your API keys are stored only in this service&#39;s user database<br/>and are used solely for the proving runs you start.</div>
</div>

<script>
const $=id=>document.getElementById(id);
let mode='login';
window.hasGoogle = false;

function setMode(m){
  mode=m;
  $('tab-login').classList.toggle('active',m==='login');
  $('tab-register').classList.toggle('active',m==='register');
  $('tabs').style.display = (m==='login'||m==='register')?'flex':'none';
  $('name-row').style.display = m==='register'?'flex':'none';
  $('email-row').style.display = (m==='login'||m==='register'||m==='forgot')?'flex':'none';
  $('password-row').style.display = (m==='login'||m==='register')?'flex':'none';
  $('new-password-row').style.display = m==='reset'?'flex':'none';
  $('confirm-password-row').style.display = m==='reset'?'flex':'none';

  $('email').required = (m==='login'||m==='register'||m==='forgot');
  $('password').required = (m==='login'||m==='register');
  $('new-password').required = (m==='reset');
  $('confirm-password').required = (m==='reset');
  $('password').autocomplete = m==='register'?'new-password':'current-password';

  if(m==='register') $('submit').textContent='Create account';
  else if(m==='login') $('submit').textContent='Sign in';
  else if(m==='forgot') $('submit').textContent='Send reset email';
  else if(m==='reset') $('submit').textContent='Reset password';

  if(m==='forgot') $('sub-title').textContent='Enter your email to receive a password reset link';
  else if(m==='reset') $('sub-title').textContent='Enter a new password for your account';
  else if(m==='register') $('sub-title').textContent='Create an account to keep your runs private';
  else $('sub-title').textContent='Sign in to use your own API keys and keep your runs private';

  $('forgot-link').style.display = 'block';
  if(m==='forgot'||m==='reset'){
    $('link-forgot').textContent='← Back to sign in';
  } else {
    $('link-forgot').textContent='Forgot password?';
  }

  $('google-divider').style.display = (m==='login'&&window.hasGoogle)?'flex':'none';
  $('google-box').style.display = (m==='login'&&window.hasGoogle)?'flex':'none';
  $('err').style.display = 'none';
  $('msg').style.display = 'none';
  $('submit').style.display = 'block';
  $('submit').disabled = false;
}

$('tab-login').onclick=()=>setMode('login');
$('tab-register').onclick=()=>setMode('register');
$('link-forgot').onclick=(e)=>{
  e.preventDefault();
  if(mode==='forgot'||mode==='reset') setMode('login');
  else setMode('forgot');
};

function fail(msg){ $('err').style.display='block'; $('err').textContent=msg; $('submit').disabled=false; }

$('form').onsubmit=async e=>{
  e.preventDefault(); $('submit').disabled=true; $('err').style.display='none'; $('msg').style.display='none';
  try{
    if(mode==='login'||mode==='register'){
      const body={email:$('email').value.trim(),password:$('password').value};
      if(mode==='register')body.name=$('name').value.trim()||undefined;
      const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||'Request failed');
      location.href=(window.__pcUrl?window.__pcUrl('/'):'/');
    } else if(mode==='forgot'){
      const email=$('email').value.trim();
      if(!email) throw new Error('Please enter your email address');
      const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||'Request failed');
      $('msg').style.display='block';
      $('msg').textContent=d.message||'If that email exists, a reset link has been sent.';
      $('submit').disabled=false;
    } else if(mode==='reset'){
      const urlParams=new URLSearchParams(location.search);
      const token=(urlParams.get('token')||'').trim();
      if(!token)throw new Error('Missing password reset token');
      const new_password=$('new-password').value;
      const confirm_password=$('confirm-password').value;
      if(!new_password)throw new Error('Please enter a new password');
      if(new_password.length < 8)throw new Error('Password must be at least 8 characters');
      if(new_password !== confirm_password)throw new Error('Passwords do not match');

      const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||'Password reset failed');
      $('msg').style.display='block';
      $('msg').textContent='Password reset successfully! Redirecting to sign in...';
      $('new-password').value='';
      $('confirm-password').value='';
      $('submit').disabled=true;
      setTimeout(()=>{
        setMode('login');
        $('msg').style.display='block';
        $('msg').textContent='Password reset successfully! Please sign in with your new password.';
        if(window.history&&window.history.replaceState){
          window.history.replaceState({},document.title,window.__pcUrl?window.__pcUrl('/login'):_with_base('/login'));
        }
      }, 1500);
    }
  }catch(err){ fail(String(err.message)); }
};

function _with_base(p){
  const B = window.__PC_BASE__ || '';
  return B ? (B + p) : p;
}

async function handleGoogle(resp){
  try{
    const r=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:resp.credential})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Google sign-in failed');
    location.href=(window.__pcUrl?window.__pcUrl('/'):'/');
  }catch(err){ fail(String(err.message)); }
}

async function initResetMode(token){
  setMode('reset');
  if(!token){
    fail('Missing password reset token. Please check your email link or request a new reset email.');
    $('new-password-row').style.display='none';
    $('confirm-password-row').style.display='none';
    $('submit').style.display='none';
    return;
  }
  try{
    const r=await fetch('/api/auth/verify-reset-token?token='+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok||!d.valid){
      fail(d.error||'This password reset link is invalid or has expired.');
      $('new-password-row').style.display='none';
      $('confirm-password-row').style.display='none';
      $('submit').style.display='none';
      return;
    }
    if(d.email){
      $('sub-title').textContent='Enter a new password for '+d.email;
    }
  }catch(err){
    fail('Unable to verify this password reset link. Please request a new one and try again.');
    $('new-password-row').style.display='none';
    $('confirm-password-row').style.display='none';
    $('submit').style.display='none';
  }
}

(async()=>{
  try{
    const urlParams=new URLSearchParams(location.search);
    const token=(urlParams.get('token')||'').trim();
    const isReset=location.pathname.includes('/reset-password')||Boolean(token);

    const me=await(await fetch('/api/auth/me')).json();
    if(me.user && !me.user.guest && !isReset){
      location.href=(window.__pcUrl?window.__pcUrl('/'):'/');
      return;
    }

    if(me.google_client_id){
      window.hasGoogle = true;
      const s=document.createElement('script');
      s.src='https://accounts.google.com/gsi/client'; s.async=true;
      s.onload=()=>{
        google.accounts.id.initialize({client_id:me.google_client_id,callback:handleGoogle});
        if(mode==='login'){
          $('google-divider').style.display='flex';
          $('google-box').style.display='flex';
        }
        google.accounts.id.renderButton($('google-box'),{theme:'outline',size:'large',width:340,text:'signin_with'});
      };
      document.head.appendChild(s);
    }

    if(isReset){
      await initResetMode(token);
    }
  }catch(e){}
})();
</script>
</body>
</html>
