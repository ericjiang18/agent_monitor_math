# Define the installable Python package, CLI entry point, and dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitor"
version = "0.1.0"
description = "Unified math proving console: Math Agent Harness, IMProof, Hermes, shared DAG, and Lean monitor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  # Monitor / dashboard
  "rich>=13.0.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  # Hermes agent core (aligned with vendored hermes_core pins where practical)
  "openai==2.24.0",
  # Anthropic API calls (runners/api_backend.py).  1.13.0 sends API version
  # 2023-06-01 and X-Api-Key, as the console's other Anthropic calls do; its
  # HTTP stack is pinned at the release it shipped with (2.14+ are newer).
  "anthropic==1.13.0",
  "httpx2==2.13.1",
  "httpcore2==2.13.1",
  "httpx[socks]==0.28.1",
  "tenacity==9.1.4",
  "ruamel.yaml==0.18.17",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "prompt_toolkit==3.0.52",
  "croniter==6.0.0",
  "packaging==26.0",
  "Markdown==3.10.2",
  "PyJWT[crypto]==2.15.1",
  "urllib3>=2.8.0,<3",
  "cryptography==50.0.2",
  "psutil==7.2.2",
  "ptyprocess==0.7.0; sys_platform != 'win32'",
  "fire==0.7.1",
  "certifi==2026.10.23",
  # UCLA literature research extracts downloaded primary-source PDFs.
  # Keep this in the main environment because UCLA runs with sys.executable.
  "PyMuPDF>=1.24,<2",
  # Problem sources (Kourovka Notebook PDF text) and Analyze (LaTeX structure,
  # PDF text; parsed in sandboxed subprocesses).  MIT and BSD licensed; pinned
  # because three units share the venv and parser output feeds stored analyses.
  "pylatexenc==2.11",
  "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-monitor = "agent_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_monitor*", "monitor_core*"]

[tool.setuptools.package-data]
agent_monitor = ["web/**/*", "starter_skills/**/*", "examples/**/*", "data/**/*", "cgm/LICENSE", "cgm/NOTICE.md"]
monitor_core = ["harness_dashboard/web/**/*"]

# Keep locally archived projects out of automatic test discovery.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "node_modules", "venv", "deleted"]
